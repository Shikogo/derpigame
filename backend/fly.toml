# fly.toml — derpigame backend (FastAPI + Socket.IO). Single always-on machine,
# in-memory state, no volume. Deploy from backend/: `fly deploy`.
app = "derpigame"
primary_region = "fra"

[build]

[env]
  # Drives both CORS and the Socket.IO handshake. JSON list (pydantic parses it).
  # Both origins now so the future custom domain needs no backend redeploy.
  DERPIGAME_SERVER__CORS_ORIGINS = '["https://shikogo.github.io", "https://derpigame.shikogo.com"]'

[http_service]
  internal_port = 8080
  force_https = true
  # No autosuspend: keep one machine running 24/7.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1