# fly.toml — derpigame backend (FastAPI + Socket.IO). Single always-on machine,
# in-memory state, no volume. Deploy from backend/: `fly deploy`.
app = "derpigame"
primary_region = "fra"

[build]

[env]
  # Drives both CORS and the Socket.IO handshake. JSON list (pydantic parses it).
  # The custom domain is what players use; the pages.dev name is the same build
  # reachable directly, which is what you check a deploy on before cutting over.
  DERPIGAME_SERVER__CORS_ORIGINS = '["https://derpigame.shikogo.com", "https://derpigame.pages.dev"]'
  # Cloudflare gives every branch build its own subdomain, so preview deploys
  # can't be listed. Matched whole, and narrow enough that only that project's
  # previews pass. Single-quoted: TOML would read \. in a "" string as an escape.
  DERPIGAME_SERVER__CORS_ORIGIN_REGEX = 'https://[a-z0-9-]+\.derpigame\.pages\.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # Single always-on machine: auto_stop "off" keeps it running 24/7 (min_machines_running
  # is only a floor for autostop, which is disabled). min_machines_running = 0 also stops
  # `fly deploy` from adding a 2nd HA machine — this app is single-instance/in-memory, so a
  # 2nd machine breaks socket.io's sticky session (the handshake sid the other node can't see).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1