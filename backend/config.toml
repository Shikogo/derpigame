# derpigame server config.
#
# Checked in on purpose: this is curation and tuning, the kind of change worth
# seeing in a diff. Secrets and per-deployment values belong in the environment
# (or backend/.env, which is gitignored) — every field here can be overridden
# with DERPIGAME_<SECTION>__<FIELD>, e.g.:
#
#   DERPIGAME_SOURCES__DERPIBOORU__API_KEY=...
#   DERPIGAME_SERVER__CORS_ORIGINS='["https://derpigame.shikogo.com"]'
#
# Unknown keys are a startup error, so a typo here won't silently do nothing.


[server]
# Origins allowed to reach the API *and* open the websocket. "*" is fine for
# local play; narrow this to the real frontend origin before deploying. A
# deployment that also wants preview builds sets cors_origin_regex alongside it
# (see fly.toml) — one whole-match pattern for origins there's no listing.
cors_origins = ["*"]


# Tags the game refuses to score, per source — the two boorus have different
# housekeeping vocabularies. These replace the taxonomy's own lists rather than
# adding to them, so this file is the whole truth: deleting a line makes that tag
# guessable again. Entries are glob patterns (fnmatch: * ? []), so one line
# catches a whole family — a plain string matches exactly, "prefix:*" drops a
# whole namespace, "*text*" matches a substring. These cover tags that can't be
# derived from looking at the image (source-link housekeeping, "…in the comments"
# memes), which would otherwise sit in the goal bucket and block an unreachable win.
[taxonomy.derpibooru]
ignored_tags = [
  "commission",
  "dead source",
  "derpibooru exclusive",
  "source needed",
  "useless source link",
  "youtube link",
  "*comments*",
  "spoiler:*",
  "commissioner:*",
  "editor:*",
]

[taxonomy.furbooru]
ignored_tags = [
  "commission",
  "dead source",
  "source needed",
  "useless source link",
  "youtube link",
  "*comments*",
  "spoiler:*",
  "commissioner:*",
  "editor:*",
]


[room_defaults]
# What a new room starts with, before anyone opens the settings panel.
nsfw = false
query = []
turn_seconds = 60.0
# Which image provider a new room pulls from: "derpibooru" or "furbooru".
source = "derpibooru"
# Enough tags to make a round worth playing; enough score to skip junk uploads.
# A room can switch either bound off at runtime; TOML has no null, so it can't
# be done from here — set 0 to make the bound effectively inert instead.
min_tag_count = 15
min_score = 10
# rating_caps: the highest level allowed per axis, from the source's own
# vocabulary. Safe-by-default — a new room shows no suggestive or dark content on
# either booru. This is the cap that keeps it clean, not the SFW filter alone:
# Furbooru's "suggestive" is racier than Derpibooru's and its SFW filter still
# serves it. A host raises these in the settings panel; note an NSFW room also
# needs the cap lifted, since the cap gates content regardless of the filter.
[room_defaults.rating_caps]
rating = "safe"
darkness = "none"


[game]
# Wrong guesses (or timeouts) before a player is out.
elimination_threshold = 3
# Similarity at or above which a wrong guess is a free retry instead of a strike.
near_miss_threshold = 0.85


# Image providers. Both are Philomena instances, so they share every knob and
# differ only by host and filters. api_key belongs in the environment, not here
# (e.g. DERPIGAME_SOURCES__DERPIBOORU__API_KEY). The mandatory back-offs: raising
# them is always safe; lowering them risks an IP block.
[sources.derpibooru]
base_url = "https://derpibooru.org"
timeout = 10.0
user_agent = "derpigame/0.1 (https://github.com/Shikogo/derpigame)"
# Sent explicitly so we never inherit the anonymous site default, a legacy filter
# that surfaces AI-generated content. The nsfw filter blocks AI art but permits
# every rating tag, so a room's own caps decide how far a game goes.
default_filter_id = "100073"
nsfw_filter_id = "232619"
challenge_backoff = 5.0
block_backoff = 900.0
failure_backoff_base = 1.0
failure_backoff_max = 60.0

[sources.furbooru]
base_url = "https://furbooru.org"
user_agent = "derpigame/0.1 (https://github.com/Shikogo/derpigame)"
# 1 = system "Default" (sfw): hides questionable/explicit plus most AI art.
# 12153 = a custom, rating-permissive filter that blocks AI, drama, and politics.
# Furbooru's system 18+ filter (62) was measured to block no AI, so a custom
# filter carries the AI policy for nsfw rooms instead. It's public, so the
# anonymous client can apply it (no api_key needed).
default_filter_id = "1"
nsfw_filter_id = "12153"


[limits]
# Bounds on what a client may ask for — abuse control, not gameplay tuning.
max_query_terms = 24
min_turn_seconds = 10.0
max_turn_seconds = 300.0
max_query_lookups = 8
# A tab close/refresh clears fast; an unexpected network drop holds the seat longer.
unload_grace_seconds = 5.0
reconnect_grace_seconds = 30.0


[logging]
# Server log verbosity: DEBUG, INFO, WARNING, ERROR, or CRITICAL. Override per
# deployment with DERPIGAME_LOGGING__LEVEL=DEBUG.
level = "INFO"
