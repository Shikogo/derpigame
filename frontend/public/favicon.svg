<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bubble {
      fill: #626b7a;
    }
    .shine {
      fill: #fff;
      opacity: 0.9;
    }
    @media (prefers-color-scheme: dark) {
      .bubble {
        fill: #aab1c1;
      }
    }
  </style>
  <g>
    <circle class="bubble" cx="11" cy="20" r="8" />
    <circle class="shine" cx="8" cy="16.6" r="1.8" />
  </g>
  <g opacity=".8">
    <circle class="bubble" cx="23" cy="11" r="5.5" />
    <circle class="shine" cx="20.9" cy="8.7" r="1.2" />
  </g>
  <g opacity=".65">
    <circle class="bubble" cx="25" cy="24.5" r="3.5" />
    <circle class="shine" cx="23.7" cy="23" r="0.8" />
  </g>
</svg>
