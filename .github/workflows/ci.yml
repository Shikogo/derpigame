name: CI

# The quality gate from DEVELOPMENT.md, then the deploys that gate on it — all in
# one run. Keep it that way: GitHub expands a called workflow separately for each
# caller, so moving the deploys back out into their own workflows would run the
# end-to-end suite once per workflow rather than once per push.

on:
  # Every branch, not just main: a branch push builds a Cloudflare preview at a
  # URL of its own. Only main deploys to production — the two are told apart by
  # the --branch wrangler is given, and by an explicit gate on the Fly deploy.
  #
  # Dependabot's branches are the exception. Its runs are handed a separate
  # secret store, so the deploy step would find no Cloudflare token and fail the
  # run; a preview of a dependency bump is worth little either way. They still
  # get the full gate below, through the pull_request trigger it opens with.
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:
    # A manual run has nothing to diff against, so it deploys what you ask for.
    inputs:
      deploy_backend:
        description: Deploy the backend to Fly
        type: boolean
        default: false
      deploy_frontend:
        description: Deploy the frontend to Cloudflare Pages
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch makes the older run — and the preview it would have
# published — obsolete. A push to main carries the deploys, and a half-applied
# release to the single always-on machine is worse than waiting, so those queue
# instead of cancelling, which also leaves only one deploy in flight at a time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which half changed, so a frontend-only push doesn't restart the backend
  # machine and drop the rooms it's holding.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Root .python-version, as the frontend job reads .nvmrc. Keep
          # backend/Dockerfile and ruff's target-version on the same version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      # --check, not the in-place format the local command uses: a formatting
      # slip should fail the run, not be rewritten on a runner and discarded.
      - run: ruff format --check app tests
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # Nothing here drives a browser; skip the ~100MB postinstall download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run lint
      # --check, not the in-place format the local command uses: a formatting
      # slip should fail the run, not be rewritten on a runner and discarded.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

  # Needs both halves of the repo: the specs drive the real frontend against the
  # offline backend (`backend/dev_server.py`), whose fixed images make a round's
  # outcome something worth asserting on. Both deploys gate on it — neither half
  # should ship on the strength of its own unit suite alone.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Root .python-version, as the frontend job reads .nvmrc. Keep
          # backend/Dockerfile and ruff's target-version on the same version.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Into the venv path playwright.config.ts starts the backend from, so the
      # command is the same one a dev runs locally.
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
        env:
          # The next step fetches the one browser this needs; letting the
          # postinstall pull the full set first is the same download twice over.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # A runner has no system chromium, so use Playwright's own — which is what
      # the config falls back to whenever CI is set.
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The unit gate stays per half — an unrelated frontend failure shouldn't block a
  # backend fix, or the other way round — but e2e gates both.
  deploy-backend:
    needs: [changes, backend, e2e]
    # Pinned to main: there's one backend machine and no preview of it, so a
    # branch push must never reach it the way a frontend branch push does.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.changes.outputs.backend == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_backend)
    runs-on: ubuntu-latest
    # The token lives in this environment, not repo-wide. Gate it in repo settings
    # to the main branch (and a required reviewer, if you want a manual approval
    # before the single machine restarts and drops active rooms).
    environment: fly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # --remote-only builds on Fly's builders, so the runner needs no Docker.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # One job where Pages needed two: wrangler uploads the build itself, so there's
  # no artifact to hand over. Repo secrets rather than a deployment environment —
  # previews deploy from every branch, and an environment gated to main (the way
  # `fly` is) would block exactly those.
  deploy-frontend:
    needs: [changes, frontend, e2e]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.frontend == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # Nothing here drives a browser; skip the ~100MB postinstall download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
        env:
          # Inlined at build time; public URL, not a secret. Update if the fly app
          # name changes (keep in sync with backend/fly.toml `app`). A preview
          # build points at the same backend and shares its live rooms.
          VITE_BACKEND_URL: https://derpigame.fly.dev
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # --branch decides which of the two this is: Cloudflare treats a deploy
          # naming the project's production branch as production, anything else
          # as a preview at <branch>.derpigame.pages.dev. So the project's
          # production branch must stay `main`.
          command: pages deploy dist --project-name=derpigame --branch=${{ github.ref_name }}
