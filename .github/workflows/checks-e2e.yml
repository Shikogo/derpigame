name: End-to-end checks

# Reusable so the same suite gates both a push and the deploys — callable only,
# never triggered on its own. `checks.yml` runs it for pushes and PRs.
#
# Needs both halves of the repo: the specs drive the real frontend against the
# offline backend (`backend/dev_server.py`), whose fixed images make a round's
# outcome something worth asserting on.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Keep in sync with backend/Dockerfile and ruff's target-version.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Into the venv path playwright.config.ts starts the backend from, so the
      # command is the same one a dev runs locally.
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
        env:
          # The next step fetches the one browser this needs; letting the
          # postinstall pull the full set first is the same download twice over.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # A runner has no system chromium, so use Playwright's own — which is what
      # the config falls back to whenever CI is set.
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
