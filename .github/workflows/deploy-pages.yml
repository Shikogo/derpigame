name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # `npm run build` already type-checks, so a type error could never ship; this
  # extends that to lint, formatting and the tests. Unit suite is frontend only —
  # an unrelated backend failure shouldn't hold up a Pages deploy.
  checks:
    uses: ./.github/workflows/checks-frontend.yml
  # The deliberate exception: e2e spans both halves, so a broken backend does
  # stop a frontend deploy. Shipping a frontend that can't play a round through
  # is worse than waiting on the extra install.
  e2e:
    uses: ./.github/workflows/checks-e2e.yml

  build:
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Inlined at build time; public URL, not a secret. Update if the fly app
          # name changes (keep in sync with backend/fly.toml `app`).
          VITE_BACKEND_URL: https://derpigame.fly.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4