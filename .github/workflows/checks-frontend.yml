name: Frontend checks

# Reusable so the same suite gates both a push and the Pages deploy — callable
# only, never triggered on its own. `checks.yml` runs it for pushes and PRs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # Nothing here drives a browser; skip the ~100MB postinstall download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run lint
      # --check, not the in-place format the local command uses: a formatting
      # slip should fail the run, not be rewritten on a runner and discarded.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
