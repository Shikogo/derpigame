name: Backend checks

# Reusable so the same suite gates both a push and the Fly deploy — callable
# only, never triggered on its own. `checks.yml` runs it for pushes and PRs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep in sync with backend/Dockerfile and ruff's target-version.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      # --check, not the in-place format the local command uses: a formatting
      # slip should fail the run, not be rewritten on a runner and discarded.
      - run: ruff format --check app tests
      - run: python -m pytest
