name: Checks

# The quality gate from DEVELOPMENT.md, run for real. Both halves live in
# callable workflows so the deploys can gate on the same suite rather than a
# copy of it — see deploy-fly.yml and deploy-pages.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete; deploys are the
# ones that must never be interrupted, and they live in their own workflows.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/checks-backend.yml
  frontend:
    uses: ./.github/workflows/checks-frontend.yml
  e2e:
    uses: ./.github/workflows/checks-e2e.yml
