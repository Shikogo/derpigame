name: Checks

# The quality gate from DEVELOPMENT.md, run for real. Every command here is the
# non-mutating twin of the local one — `ruff format --check` and
# `npm run format:check` report instead of rewriting, so a formatting slip fails
# the run rather than being silently fixed on a runner and thrown away.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete; deploys are the
# ones that must never be interrupted, and they live in their own workflows.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep in sync with backend/Dockerfile and ruff's target-version.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # Nothing here drives a browser; skip the ~100MB postinstall download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
