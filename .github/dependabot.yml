version: 2

# Every PR runs the full CI gate, which is what makes unattended updates
# workable. Minor/patch are grouped per ecosystem — the pinned requirements
# would otherwise open a PR per transitive bump; majors stay separate.

updates:
  # The workflow actions in ci.yml — the set nobody checks by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint peers at <6.1.0; lift when it accepts 7.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Transitives are pinned here too, and Dependabot bumps a pin without
  # re-resolving — the fresh-venv regen in requirements.txt stays the truth.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend:
        update-types: [minor, patch]
    ignore:
      # pydantic pins pydantic-core exactly; bumped alone it won't install.
      - dependency-name: pydantic-core

  # A notification, not a merge: the python version also lives in
  # .python-version and ruff's target-version, and the three move together.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
